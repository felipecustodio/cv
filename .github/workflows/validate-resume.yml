name: Validate Resume Generation

on:
  pull_request:
    paths:
      - resume.yaml
      - index.html
      - main.tex
      - .github/scripts/update_resume.py
      - tests/**
      - requirements*.txt
      - assets/**
      - .github/workflows/validate-resume.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover tests/

      - name: Regenerate resume outputs
        run: python .github/scripts/update_resume.py

      - name: Ensure generated files are committed
        run: git diff --exit-code -- index.html main.tex
