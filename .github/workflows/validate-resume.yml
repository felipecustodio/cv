name: Validate Resume Generation

on:
  pull_request:
    paths:
      - resume.yaml
      - index.html
      - main.tex
      - pt-br/index.html
      - pt-br/main.tex
      - resume.pdf
      - pt-br/resume.pdf
      - .github/scripts/update_resume.py
      - tests/**
      - .github/scripts/verify_resume_pdf.py
      - requirements*.txt
      - assets/**
      - justfile
      - .github/workflows/validate-resume.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - uses: extractions/setup-just@v4

      - name: Install dependencies
        run: just install

      - uses: actions/cache@v3
        name: Tectonic Cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - uses: wtfjoke/setup-tectonic@v3

      - name: Verify generated resumes
        run: just verify

      - name: Ensure generated files are committed
        run: git diff --exit-code -- index.html main.tex pt-br/index.html pt-br/main.tex

