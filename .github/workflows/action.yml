name: 'Build PDF Resume'
on:
  push:
  workflow_run:
    workflows: ["Update Resume from YAML"]
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    # Only run if the update workflow was successful or this is a direct push
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v3
        name: Tectonic Cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - uses: wtfjoke/setup-tectonic@v3

      - name: Run Tectonic
        run: tectonic main.tex

      - name: Upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: main
          path: main.pdf