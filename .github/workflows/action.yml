name: 'Build PDF Resume'
on:
  workflow_run:
    workflows: ["Update Resume from YAML"]
    types:
      - completed
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Run only when resume update workflow succeeds, or when manually triggered.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/cache@v3
        name: Tectonic Cache
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('**/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - uses: wtfjoke/setup-tectonic@v3

      - name: Run Tectonic
        run: tectonic main.tex

      - name: Upload pdf
        uses: actions/upload-artifact@v4
        with:
          name: main
          path: main.pdf

      - name: Commit and Push PDF
        run: |
          mv main.pdf resume.pdf
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add resume.pdf
          git commit -m 'build: Update generated PDF' || echo "No changes to commit"
          git push origin main
